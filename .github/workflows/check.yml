name: Check source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: actions/cache@v4
        with:
          path: .cache/sample-zips
          key: piano-samples-${{ hashFiles('assets/samples.json') }}
      - name: Download and verify piano samples
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/sample-zips
          gh release download samples-v1 --repo clementine477/piano-practice --pattern '*.zip' --dir .cache/sample-zips --skip-existing
          python3 tools/fetch-samples.py --from-dir .cache/sample-zips
      - run: pnpm build
      - run: pnpm check:public
